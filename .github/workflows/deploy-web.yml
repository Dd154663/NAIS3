# 웹(모바일/PWA) 빌드를 GitHub Pages에 배포 — src/web/README.md 참조.
# mobile-port 브랜치에 push할 때마다 https://<owner>.github.io/<repo>/ 가 갱신된다.
name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [mobile-port]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: electron-builder postinstall(네이티브 리빌드)은 웹 빌드에 불필요
      - run: npm ci --ignore-scripts

      - run: npm run build:web
        env:
          WEB_BASE: /${{ github.event.repository.name }}/
          # Google Drive OAuth 클라이언트 ID (P6). 저장소 변수 미설정이면 빈 값 →
          # Drive 기능은 런타임에서 스스로 숨는다(isDriveConfigured). 빌드는 실패하지 않음.
          VITE_GDRIVE_CLIENT_ID: ${{ vars.GDRIVE_CLIENT_ID }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/web

      - id: deployment
        uses: actions/deploy-pages@v4
