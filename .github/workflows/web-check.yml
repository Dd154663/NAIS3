# 웹(PWA) 포트 유지보수 가드레일 — src/web/README.md "유지보수 계약" 참조.
# 원작 코드 수정이 웹 포트(src/web)를 깨뜨리면 여기서 자동으로 드러난다:
#   - typecheck / test: 데스크톱 회귀 (웹 포트의 가산 수정 2곳 포함)
#   - check:web-drift: 웹이 병렬 구현한 원작 파일(src/main 글루)의 변경 감지
#   - build:web: 웹 타입체크(typecheck:webapp — 채널 커버리지 표 포함) + 번들
# 빨간불이어도 데스크톱 릴리스는 막히지 않는다 — 웹 포트 쪽 대응이 필요하다는 신호일 뿐.
name: Web Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: electron-builder postinstall(네이티브 리빌드)은 검사에 불필요.
      # tests/는 순수 로직만 다뤄 better-sqlite3 바이너리 없이 통과한다.
      - run: npm ci --ignore-scripts

      - name: 데스크톱 타입체크
        run: npm run typecheck

      - name: 데스크톱 테스트
        run: npm test

      - name: 웹 드리프트 센티널 (원작 글루 파일 변경 감지)
        run: npm run check:web-drift

      - name: 웹 타입체크 + 빌드
        run: npm run build:web
